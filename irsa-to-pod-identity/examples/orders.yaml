apiVersion: v1
kind: ServiceAccount
metadata:
  name: orders-api
  namespace: orders
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::111122223333:role/orders-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: orders
spec:
  selector:
    matchLabels: {app: orders-api}
  template:
    metadata:
      labels: {app: orders-api}
    spec:
      serviceAccountName: orders-api
      containers:
        - name: api
          image: 111122223333.dkr.ecr.eu-west-1.amazonaws.com/orders-api:1.8.2
          env:
            - name: HTTPS_PROXY
              value: http://egress-proxy.internal:3128
            - name: NO_PROXY
              value: 169.254.169.254,.svc,.cluster.local
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: invoice-export
  namespace: billing
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::111122223333:role/invoice-export
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: invoice-export
  namespace: billing
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: invoice-export
          restartPolicy: OnFailure
          containers:
            - name: export
              image: 111122223333.dkr.ecr.eu-west-1.amazonaws.com/invoice-export:3.1.0
