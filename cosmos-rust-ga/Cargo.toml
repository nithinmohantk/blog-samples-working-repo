[package]
name = "cosmos_orders"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[dependencies]
azure_core = "=1.1.0"
azure_data_cosmos = "=1.0.0"
azure_identity = "=1.0.0"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
