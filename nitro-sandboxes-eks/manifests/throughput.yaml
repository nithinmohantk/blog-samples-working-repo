# iperf3 server on a plain pod, and three clients: plain, sandboxed with the default
# throttles (100 Mbps, 1500 packets/s), and sandboxed with both limits raised.
# Bandwidth and packet rate are separate token buckets, so both have to be raised.
apiVersion: v1
kind: Pod
metadata:
  name: iperf-server
  namespace: sbx
  labels: {app: iperf-server}
spec:
  containers:
  - name: main
    image: public.ecr.aws/amazonlinux/amazonlinux:2023
    command: ["sh", "-c", "dnf install -y -q iperf3 >/dev/null && iperf3 -s"]
    ports: [{containerPort: 5201}]
    resources:
      requests: {cpu: 250m, memory: 256Mi}
      limits: {cpu: "1", memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: iperf-server
  namespace: sbx
spec:
  selector: {app: iperf-server}
  ports: [{port: 5201, targetPort: 5201}]
---
apiVersion: v1
kind: Pod
metadata:
  name: iperf-plain
  namespace: sbx
spec:
  containers:
  - name: main
    image: public.ecr.aws/amazonlinux/amazonlinux:2023
    command: ["sh", "-c", "dnf install -y -q iperf3 >/dev/null && sleep infinity"]
    resources:
      requests: {cpu: 250m, memory: 256Mi}
      limits: {cpu: "1", memory: 512Mi}
---
apiVersion: v1
kind: Pod
metadata:
  name: iperf-sbx-default
  namespace: sbx
spec:
  runtimeClassName: isolated-sandbox
  containers:
  - name: main
    image: public.ecr.aws/amazonlinux/amazonlinux:2023
    command: ["sh", "-c", "dnf install -y -q iperf3 >/dev/null && sleep infinity"]
    resources:
      requests: {cpu: 250m, memory: 256Mi}
      limits: {cpu: "1", memory: 512Mi}
---
apiVersion: v1
kind: Pod
metadata:
  name: iperf-sbx-raised
  namespace: sbx
  annotations:
    sandbox.amazonaws.com/ingress-bandwidth: "1G"
    sandbox.amazonaws.com/egress-bandwidth: "1G"
    sandbox.amazonaws.com/ingress-packets-per-second: "15000"
    sandbox.amazonaws.com/egress-packets-per-second: "15000"
spec:
  runtimeClassName: isolated-sandbox
  containers:
  - name: main
    image: public.ecr.aws/amazonlinux/amazonlinux:2023
    command: ["sh", "-c", "dnf install -y -q iperf3 >/dev/null && sleep infinity"]
    resources:
      requests: {cpu: 250m, memory: 256Mi}
      limits: {cpu: "1", memory: 512Mi}
