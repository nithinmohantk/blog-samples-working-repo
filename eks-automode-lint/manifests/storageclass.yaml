# Auto Mode does not create a StorageClass. Its block storage uses the
# ebs.csi.eks.amazonaws.com provisioner, not the self-managed ebs.csi.aws.com.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: auto-ebs-gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.eks.amazonaws.com
volumeBindingMode: WaitForFirstConsumer
allowedTopologies:
  - matchLabelExpressions:
      - key: eks.amazonaws.com/compute-type
        values: ["auto"]
parameters:
  type: gp3
  encrypted: "true"
