# Application Load Balancers in Auto Mode: IngressClassParams configures the
# load balancer; the IngressClass points at the eks.amazonaws.com/alb controller.
apiVersion: eks.amazonaws.com/v1
kind: IngressClassParams
metadata:
  name: internal-alb
spec:
  scheme: internal
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: internal-alb
spec:
  controller: eks.amazonaws.com/alb
  parameters:
    apiGroup: eks.amazonaws.com
    kind: IngressClassParams
    name: internal-alb
