name: AWS public IPv4 audit

on:
  push:
    paths:
      - "aws-public-ipv4-charge-audit/**"
      - ".github/workflows/aws-ipv4.yml"
  workflow_dispatch:

permissions:
  contents: write   # only to publish the result files to a results branch

concurrency:
  group: aws-ipv4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python packages as of 26 January 2024
        run: |
          pip install -q uv
          uv pip install --system -q --exclude-newer 2024-01-26 boto3 "moto[ec2]" pytest

      - name: Run the sample
        id: samples
        continue-on-error: true
        run: ./aws-public-ipv4-charge-audit/ci.sh "$GITHUB_WORKSPACE/out/aws-public-ipv4-charge-audit"

      - name: Publish the results
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out
          {
            echo "commit: $GITHUB_SHA"
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "samples: ${{ steps.samples.outcome }}"
          } > out/run.txt
          publish="$RUNNER_TEMP/publish"
          rm -rf "$publish" && mkdir -p "$publish" && cp -r out/. "$publish/"
          cd "$publish"
          git init -q -b ci-results-aws-ipv4
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Results for $GITHUB_SHA"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-results-aws-ipv4

      - name: Fail the build if the sample failed
        if: steps.samples.outcome != 'success'
        run: exit 1
