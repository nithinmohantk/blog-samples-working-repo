name: pgvector 0.6.0 parallel HNSW builds

on:
  push:
    paths:
      - "pgvector-060-parallel-hnsw/**"
      - ".github/workflows/pgvector-hnsw.yml"
  workflow_dispatch:

permissions:
  contents: write   # only to publish the result files to a results branch

concurrency:
  group: pgvector-hnsw-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python packages as of 2 February 2024
        run: |
          pip install -q uv
          uv pip install --system -q --exclude-newer 2024-02-02 "psycopg[binary]" numpy h5py pytest

      - name: Run the benchmark
        id: samples
        continue-on-error: true
        run: ./pgvector-060-parallel-hnsw/ci.sh "$GITHUB_WORKSPACE/out/pgvector-060-parallel-hnsw"

      - name: Publish the results
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out
          {
            echo "commit: $GITHUB_SHA"
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "samples: ${{ steps.samples.outcome }}"
          } > out/run.txt
          publish="$RUNNER_TEMP/publish"
          rm -rf "$publish" && mkdir -p "$publish" && cp -r out/. "$publish/"
          cd "$publish"
          git init -q -b ci-results-pgvector-hnsw
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Results for $GITHUB_SHA"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-results-pgvector-hnsw

      - name: Fail the build if the benchmark failed
        if: steps.samples.outcome != 'success'
        run: exit 1
