name: Agentic UI with a real model

on:
  push:
    paths:
      - "agentic-ui-real-model/**"
      - ".github/workflows/agentic-ui-real-model.yml"
  workflow_dispatch:

permissions:
  contents: write   # only to publish the result files to a results branch

concurrency:
  group: agentic-ui-real-model-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "11.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run each sample
        id: samples
        continue-on-error: true
        env:
          # Optional. Without them the lab step is skipped and only the offline part runs.
          MODEL_ENDPOINT: ${{ vars.MODEL_ENDPOINT }}
          MODEL_NAME: ${{ vars.MODEL_NAME }}
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        run: |
          status=0
          for sample in agentic-ui-real-model; do
            if [ -x "./$sample/ci.sh" ]; then
              "./$sample/ci.sh" "$GITHUB_WORKSPACE/out/$sample" || status=1
            fi
          done
          exit $status

      - name: Publish the results
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out
          {
            echo "commit: $GITHUB_SHA"
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "samples: ${{ steps.samples.outcome }}"
          } > out/run.txt
          publish="$RUNNER_TEMP/publish"
          rm -rf "$publish" && mkdir -p "$publish" && cp -r out/. "$publish/"
          cd "$publish"
          git init -q -b ci-results-agentic-ui-real-model
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Results for $GITHUB_SHA"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-results-agentic-ui-real-model

      - name: Fail the build if a sample failed
        if: steps.samples.outcome != 'success'
        run: exit 1
