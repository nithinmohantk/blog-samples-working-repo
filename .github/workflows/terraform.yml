name: Terraform samples

on:
  push:
    paths:
      - "terraform-testing-ci/**"
      - "terraform-two-clouds/**"
      - "terraform-vs-opentofu/**"
      - "aca-vs-aks-regulated/**"
      - "azure-active-active/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

permissions:
  contents: write   # only to publish the result files to a results branch

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.3"
          terraform_wrapper: false
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.12.6"
          tofu_wrapper: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run each sample
        id: samples
        continue-on-error: true
        run: |
          status=0
          for sample in ${SAMPLES:-terraform-testing-ci terraform-two-clouds terraform-vs-opentofu aca-vs-aks-regulated azure-active-active}; do
            if [ -x "./$sample/ci.sh" ]; then
              "./$sample/ci.sh" "$GITHUB_WORKSPACE/out/$sample" || status=1
            fi
          done
          exit $status

      - name: Publish the results
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out
          {
            echo "commit: $GITHUB_SHA"
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "samples: ${{ steps.samples.outcome }}"
          } > out/run.txt
          publish="$RUNNER_TEMP/publish"
          rm -rf "$publish" && mkdir -p "$publish" && cp -r out/. "$publish/"
          cd "$publish"
          git init -q -b ci-results-terraform
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Results for $GITHUB_SHA"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-results-terraform

      - name: Fail the build if a sample failed
        if: steps.samples.outcome != 'success'
        run: exit 1
