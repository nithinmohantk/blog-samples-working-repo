# Local run of the Function App with a PostgreSQL projection store. The FHIR server is the HAPI instance from
# ../clinical-queries/docker (port 8090). Events are built by the replay script; no Event Grid is involved.
name: fhir-events

services:
  projection-db:
    image: postgres:16
    environment:
      POSTGRES_USER: projection
      POSTGRES_PASSWORD: projection-local-only
      POSTGRES_DB: projection
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projection -d projection"]
      interval: 3s
      timeout: 3s
      retries: 20

  functions:
    build: .
    environment:
      FUNCTIONS_WORKER_RUNTIME: dotnet-isolated
      AzureWebJobsStorage: ""
      # Keys come from a file so the local keys are known. Throwaway values for a loopback-only stack.
      AzureWebJobsSecretStorageType: files
      FHIR_BASE_URL: http://host.docker.internal:8090/fhir
      PROJECTION_DB: Host=projection-db;Username=projection;Password=projection-local-only;Database=projection
    volumes:
      - ./local/host.secrets.json:/azure-functions-host/Secrets/host.json
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:7071:80"
    depends_on:
      projection-db:
        condition: service_healthy

  # Runs once, writes python/report.json and exits.
  replay:
    image: python:3.13-slim
    working_dir: /work
    volumes:
      - ./python:/work
    environment:
      FHIR_URL: http://host.docker.internal:8090/fhir
      FUNC_URL: http://functions:80
      FUNC_KEY: local-dev-master-key-not-a-secret
      EVENTGRID_KEY: local-dev-eventgrid-key-not-a-secret
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: sh -c "pip install --quiet --disable-pip-version-check --root-user-action=ignore -r requirements.txt && python replay_events.py --report report.json"
    depends_on:
      - functions
