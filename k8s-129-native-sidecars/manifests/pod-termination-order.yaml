# Two sidecars and a main container. Each one writes the node's uptime to a
# host file when it gets SIGTERM and when it exits. Main takes 3 seconds to
# stop, each sidecar takes 1.
apiVersion: v1
kind: Pod
metadata:
  name: termination-order
spec:
  terminationGracePeriodSeconds: 30
  volumes:
    - name: events
      hostPath: {path: /tmp/sidecar-events/termination-order, type: DirectoryOrCreate}
  initContainers:
    - name: first-sidecar
      image: busybox:1.36.1
      restartPolicy: Always
      volumeMounts: [{name: events, mountPath: /events}]
      command: ["sh", "-c", "log() { echo \"$(cut -d' ' -f1 /proc/uptime) first-sidecar $1\" >> /events/log; }; trap 'log TERM; sleep 1; log exit; exit 0' TERM; log start; while true; do sleep 0.2; done"]
    - name: second-sidecar
      image: busybox:1.36.1
      restartPolicy: Always
      volumeMounts: [{name: events, mountPath: /events}]
      command: ["sh", "-c", "log() { echo \"$(cut -d' ' -f1 /proc/uptime) second-sidecar $1\" >> /events/log; }; trap 'log TERM; sleep 1; log exit; exit 0' TERM; log start; while true; do sleep 0.2; done"]
  containers:
    - name: main
      image: busybox:1.36.1
      volumeMounts: [{name: events, mountPath: /events}]
      command: ["sh", "-c", "log() { echo \"$(cut -d' ' -f1 /proc/uptime) main $1\" >> /events/log; }; trap 'log TERM; sleep 3; log exit; exit 0' TERM; log start; while true; do sleep 0.2; done"]
