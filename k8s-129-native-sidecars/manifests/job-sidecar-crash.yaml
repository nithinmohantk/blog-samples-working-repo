# The sidecar exits with an error after 3 seconds. The Pod's restartPolicy is Never.
apiVersion: batch/v1
kind: Job
metadata:
  name: sidecar-crash
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: log-shipper
          image: busybox:1.36.1
          restartPolicy: Always
          command: ["sh", "-c", "sleep 3; exit 1"]
      containers:
        - name: main
          image: busybox:1.36.1
          command: ["sh", "-c", "sleep 25"]
